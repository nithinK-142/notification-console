root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
entrypoint = ["./tmp/api"]
include_ext = ["go"]
include_file = [".env"]
exclude_dir = ["tmp", "vendor", "web"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 30000000000

[log]
time = true

[misc]
clean_on_exit = true
