root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
cmd = "go build -o ./tmp/worker ./cmd/worker"
entrypoint = ["./tmp/worker"]
include_ext = ["go"]
include_file = [".env", "notification-service-key.json"]
exclude_dir = ["tmp", "vendor"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 30000000000

[log]
time = true

[misc]
clean_on_exit = true
